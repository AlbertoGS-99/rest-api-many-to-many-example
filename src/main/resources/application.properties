spring.application.name=rest-api-many-to-many-example

#Configurar las credenciales de conexion a la base de datos
spring.datasource.url=jdbc:mysql://localhost:3306/rest-api-ManytoMany
spring.datasource.username=root
spring.datasource.password=Temp2025

# Para configurar el ORM Hibernate
spring.jpa.database-platform=org.hibernate.dialect.MySQLDialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=true
spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

# La siguiente clave (key) ofrece mas informacion por la consola respecto a las consultas
# o sentencias del SQL generadas por HIBERNATE
spring.jpa.properties.hibernate.format_sql=true
spring.jackson.deserialization.fail-on-null-for-primitives=false

# Clave que contiene el secreto para firmar los tokens JWT, que se puede obtener
# del sitio siguiente: https://jwtsecrets.com/#generator
app.jwtSecret=51f597a49d04dc3e2eef4f642336db00367713575545d4e7259a8391a0fd6a3e38e0e2aa7ce673f1f5a62ca64a5e57905ecacf9733e34bc774a73c0545afd38a

# Tiempo de expiracion de los tokens JWT (24 horas = 86400000 milisegundos)
app.jwtExpirationMs=86400000
