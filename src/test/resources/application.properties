spring.application.name=rest-api-many-to-many-example

# Los test se ejecutan contra una base de datos en memoria (H2), de forma
# que no es necesario tener MySQL levantado para ejecutar la suite de test
spring.datasource.url=jdbc:h2:mem:appdb;DB_CLOSE_DELAY=-1
spring.datasource.username=sa
spring.datasource.password=
spring.datasource.driver-class-name=org.h2.Driver

# Configuracion de Hibernate/H2 (en produccion se usa MySQL)
spring.jpa.database-platform=org.hibernate.dialect.H2Dialect
spring.jpa.hibernate.ddl-auto=create-drop
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

spring.servlet.multipart.max-file-size=10MB
spring.servlet.multipart.max-request-size=10MB

spring.jackson.deserialization.fail-on-null-for-primitives=false

# Clave para firmar los tokens JWT y su tiempo de expiracion
app.jwtSecret=51f597a49d04dc3e2eef4f642336db00367713575545d4e7259a8391a0fd6a3e38e0e2aa7ce673f1f5a62ca64a5e57905ecacf9733e34bc774a73c0545afd38a
app.jwtExpirationMs=86400000
